<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — BCMP FSP Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo / Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-2xl mb-4 shadow-lg">
                <span class="text-3xl">🛡️</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">BCMP FSP Portal</h1>
            <p class="text-blue-200 mt-1 text-sm">Admin Dashboard Access</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-1">Sign in</h2>
            <p class="text-gray-500 text-sm mb-6">Enter the admin password to continue.</p>

            {% if error %}
            <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-5 text-sm font-medium">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" autocomplete="off">
                <div class="mb-5">
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autofocus
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-800 text-sm transition-all shadow-sm"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all text-sm tracking-wide"
                >
                    🔐 Login to Admin Dashboard
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-gray-100 text-center">
                <a href="/" class="text-blue-600 hover:underline text-sm font-medium">← Back to Nomination Form</a>
            </div>
        </div>

        <p class="text-center text-blue-300/60 text-xs mt-6">
            AVR Bootcamp 2026 &mdash; NIELIT, Ropar
        </p>
    </div>

</body>
</html>
