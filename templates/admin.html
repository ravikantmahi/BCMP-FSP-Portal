<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 py-10 px-6 font-sans">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl border border-gray-100 p-8">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">Admin Dashboard</h1>
                <p class="text-gray-500 mt-1">Review nominations and batch export un-signed PDFs from Word Template.</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/" class="text-sm font-medium text-blue-700 hover:underline px-3 py-2">← Nomination Form</a>
                <button id="refreshBtn" onclick="fetchData()"
                    class="bg-gray-100 hover:bg-gray-200 px-5 py-2.5 rounded-lg font-semibold text-sm shadow-sm transition-colors">
                    ↻ Refresh Sheet Data
                </button>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-xl p-6 mb-8 flex flex-wrap items-end gap-4">
            <div class="flex-1 min-w-[220px]">
                <label class="block text-sm font-semibold mb-2 text-gray-700">Filter by Course Year</label>
                <select id="selectedYear" onchange="renderTable()"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none bg-white font-medium cursor-pointer shadow-sm">
                    <option value="All">All Course Years (Show All)</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="N/A">N/A (Passed out)</option>
                </select>
            </div>
            <div class="flex flex-wrap gap-3">
                <button id="downloadMergedBtn" onclick="handleDownloadMergedPDF()"
                    class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center gap-2">
                    <span>📄</span> Download Merged PDF (All-in-One)
                </button>
                <button id="downloadZipBtn" onclick="handleDownloadZIP()"
                    class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center gap-2">
                    <span>📦</span> Download All PDFs (ZIP)
                </button>
            </div>
        </div>

        <!-- Table Header & Count -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800 flex items-center">
                <span>Candidate Records</span>
                <span id="candidateCount" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full ml-3">Loading...</span>
            </h2>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-xl border border-gray-200">
            <table class="w-full text-sm text-left text-gray-600">
                <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
                    <tr>
                        <th class="px-4 py-4 text-center">#</th>
                        <th class="px-6 py-4">Applicant Name</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Course Year</th>
                        <th class="px-6 py-4">Organisation</th>
                        <th class="px-6 py-4 text-center">Uploaded ID (Drive)</th>
                        <th class="px-6 py-4 text-center">Nomination Form</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">Loading data... click refresh.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let globalCandidates = [];

        function getProp(obj, ...keys) {
            if (!obj || typeof obj !== 'object') return '';
            const normalizedObj = {};
            for (const [k, v] of Object.entries(obj)) {
                normalizedObj[k.toLowerCase().replace(/[\s_\-]/g, '')] = v;
            }
            for (const key of keys) {
                const normKey = key.toLowerCase().replace(/[\s_\-]/g, '');
                if (normKey in normalizedObj && normalizedObj[normKey] !== undefined && normalizedObj[normKey] !== null) {
                    return String(normalizedObj[normKey]).trim();
                }
            }
            return '';
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const selectedYear = document.getElementById('selectedYear').value;
            const countBadge = document.getElementById('candidateCount');

            let filtered = globalCandidates;
            if (selectedYear && selectedYear !== 'All') {
                filtered = globalCandidates.filter(c => getProp(c, 'courseyear', 'year') === selectedYear);
            }

            countBadge.innerText = (selectedYear && selectedYear !== 'All')
                ? `${filtered.length} of ${globalCandidates.length} Candidates`
                : `${globalCandidates.length} Candidates`;

            if (globalCandidates.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                            No candidate records found in Google Sheet. Submit a nomination from <a href="/" class="text-blue-600 underline">the form</a>.
                        </td>
                    </tr>
                `;
                return;
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                            No candidates found for "${selectedYear}".
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(c => {
                const originalIdx = globalCandidates.indexOf(c);
                const candidateNum = originalIdx + 1;
                const title = getProp(c, 'title');
                const name = getProp(c, 'name', 'applicantname', 'candidatename');
                const status = getProp(c, 'status') || '-';
                const courseYear = getProp(c, 'courseyear', 'year') || 'N/A';
                const orgName = getProp(c, 'orgname', 'organization', 'organisation', 'academicinstitute') || '-';
                const fileUrl = getProp(c, 'fileurl', 'file', 'link', 'govidfile');

                const fileLink = (fileUrl && fileUrl !== "No File Uploaded" && fileUrl.startsWith('http'))
                    ? `<a href="${fileUrl}" target="_blank" class="text-blue-600 hover:text-blue-800 font-medium hover:underline border border-gray-200 px-3 py-1.5 rounded-lg bg-white shadow-sm inline-block text-xs" title="Open ${candidateNum}_${name}">View ID (#${candidateNum})</a>`
                    : `<span class="text-gray-400 text-xs italic">No File</span>`;

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-blue-50/60 transition-colors">
                        <td class="px-4 py-4 text-center font-bold text-gray-400 text-xs">#${candidateNum}</td>
                        <td class="px-6 py-4 font-semibold text-gray-900">${title} ${name}</td>
                        <td class="px-6 py-4">${status}</td>
                        <td class="px-6 py-4"><span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">${courseYear}</span></td>
                        <td class="px-6 py-4 truncate max-w-[200px]" title="${orgName}">${orgName}</td>
                        <td class="px-6 py-4 text-center">${fileLink}</td>
                        <td class="px-6 py-4 text-center">
                            <div class="inline-flex items-center gap-2">
                                <a href="/api/download-single/${originalIdx}"
                                    class="bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 border border-blue-300 font-semibold px-3 py-1.5 rounded-lg text-xs transition-all inline-flex items-center gap-1 shadow-sm" title="Download Form PDF">
                                    <span>📄</span> PDF
                                </a>
                                <a href="/api/download-single-docx/${originalIdx}"
                                    class="bg-emerald-50 hover:bg-emerald-600 hover:text-white text-emerald-700 border border-emerald-300 font-semibold px-3 py-1.5 rounded-lg text-xs transition-all inline-flex items-center gap-1 shadow-sm" title="Download filled Word DOCX">
                                    <span>📝</span> Word
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        async function fetchData() {
            const btn = document.getElementById('refreshBtn');
            const tbody = document.getElementById('tableBody');
            btn.innerText = 'Fetching...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/candidates');
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                globalCandidates = data;
                renderTable();
            } catch (error) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-red-600">
                            <p class="font-bold">Error loading candidates from Google Sheets</p>
                            <p class="text-xs text-red-500 mt-1">${error.message || error}</p>
                        </td>
                    </tr>
                `;
            } finally {
                btn.innerText = '↻ Refresh Sheet Data';
                btn.disabled = false;
            }
        }

        function handleDownloadMergedPDF() {
            const year = document.getElementById('selectedYear').value;
            window.location.href = `/api/download-merged?year=${encodeURIComponent(year)}`;
        }

        function handleDownloadZIP() {
            const year = document.getElementById('selectedYear').value;
            window.location.href = `/api/download-zip?year=${encodeURIComponent(year)}`;
        }

        window.onload = fetchData;
    </script>
</body>

</html>
